# Alembic configuration for DataSentinel (F019)
# Run: alembic upgrade head
#      alembic revision --autogenerate -m "description"

[alembic]
# Path to migration scripts
script_location = alembic

# Template for generating new revision files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for timestamps in new revision file names
timezone = UTC

# Max length of slug
truncate_slug_length = 40

# Use SQLAlchemy's URL from the environment — overridden in env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
