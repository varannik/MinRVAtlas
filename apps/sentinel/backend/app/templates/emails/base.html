<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f7;font-family:sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;padding:32px 0;">
    <tr><td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <!-- Header -->
        <tr>
          <td style="background:#1A1D27;padding:24px 32px;">
            <span style="color:#E8613C;font-size:20px;font-weight:800;letter-spacing:-0.5px;">DataSentinel</span>
            <span style="color:#A0A8C0;font-size:13px;margin-left:8px;">DQA Platform</span>
          </td>
        </tr>
        <!-- Body -->
        <tr>
          <td style="padding:32px;">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td style="background:#f4f4f7;padding:16px 32px;text-align:center;">
            <p style="color:#888;font-size:11px;margin:0;">
              This email was sent by DataSentinel DQA Platform.<br>
              If you did not request this, you can safely ignore this message.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
