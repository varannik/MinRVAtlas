# Project journey: what a CDR project must give a registry, step by step.
#
# Source: reports/Puro and Isometric supplier onboarding.md (Puro GSC Edition
# 2024 v5 under Certification Procedures v1.2 and General Rules v4.4; Isometric
# Standard v2.2 with BioCCS v1.5 and the In-situ Mineralization module v1.2).
#
# How it is read (src/lib/journey/definition.ts):
#   catalog    The choices in step 2: pathway type, then registries for that
#              type, then methodologies for that registry. Only methodologies
#              with `mapped: true` have their requirements below.
#   steps      The ten stations on the canvas. A task without `only` applies to
#              every registry; `by_registry` swaps its wording (or any other
#              field) for one registry. Until a registry is chosen, only the
#              shared tasks show, in their default wording.
#
# Task fields:
#   kind       question | document | generate (Cortex writes it)
#   input      text | choice | date | number | period | file | draft | location
#              choice options come from `options` or from `source`
#              (categories | registries | methodologies)
#              file `accept` is docs | sheets | docs-sheets
#   cortex     none: you fill it in, Cortex stays out of it
#              check: Cortex checks the answer against the registry's rules
#                     (`check` names a rule in src/lib/journey/cortex.ts)
#              draft: Cortex drafts the document from earlier answers
#              `uses` lists the Cortex capabilities it draws on (the pins)
#   blocks     Without it the period's credits can't be calculated or defended
#   optional   Doesn't hold the step back
#   draft      For generate tasks: `needs` (tasks it leans on) and `lines`.
#              {task.id} is that task's answer, {mark:task.id} its status,
#              {location} {registry} {methodology} {modules} {credits} {period}

version: 2026-11-16

catalog:
  categories:
    - id: technology
      label: Technology-based
      detail: Engineered capture with measured, durable storage, such as BioCCS, DAC or mineralisation in rock.
    - id: nature
      label: Nature-based
      detail: Removal by forests, soils or coasts, stored in living biomass.

  registries:
    - id: puro
      label: Puro.earth
      category: technology
      credit: { one: CORC, many: CORCs }
      pays: "The supplier pays: €1,400 a year from signature, plus a per-CORC fee (a flat €12,000 when an audit yields 1,000 CORCs or fewer)."
      evidence: An 11-module folder of Word and Excel templates.
      gate: Storage outside the USA, EEA, UK, Alberta, Saskatchewan and British Columbia needs Puro's written approval of the host country's legal framework (GSC Table 1) before the audit.
      clocks: Validation within 3 years of the Commitment Date (5 for geological storage). Output report at least every 12 months. Reversal notice within 5 days.
    - id: isometric
      label: Isometric
      category: technology
      credit: { one: credit, many: credits }
      pays: The buyer pays, per tonne on delivery ($10/t below 25,000 t on the closed-system schedule BioCCS falls under).
      evidence: Answers to a requirement list Certify generates for the protocol and modules.
      gate: BioCCS v1.5 never names cement. Fossil fuel above 5% of feedstock mass needs a justification, and a storage permit outside five named regimes needs a licensed geoscientist's report.
      clocks: About 3 months from first PDD draft to first issuance. Verification at least once a year. Reversal notice within 1 business day.
    - id: verra
      label: Verra (VCS)
      category: nature
      mapped: false
    - id: gold-standard
      label: Gold Standard
      category: nature
      mapped: false

  methodologies:
    - id: puro-gsc
      registry: puro
      label: Geologically Stored Carbon
      version: Edition 2024 v5
      detail: BioCCS or DACCS with storage in geological formations, including dissolved-CO₂ injection into ultramafic rock.
      lock: The version is fixed when the Platform Agreement is signed (CP 4.2.3).
      mapped: true
    - id: puro-biochar
      registry: puro
      label: Biochar
      mapped: false
    - id: puro-erw
      registry: puro
      label: Enhanced Rock Weathering
      mapped: false
    - id: isometric-bioccs
      registry: isometric
      label: Biogenic Carbon Capture and Storage
      version: BioCCS v1.5
      modules: [In-situ Mineralization v1.2, Biomass Feedstock Accounting v1.4, GHG Accounting v1.1, Energy Use Accounting v1.3]
      detail: Biogenic CO₂ captured at the source and stored, here by in-situ mineralisation.
      lock: The latest certified protocol at application, locked for the crediting period.
      mapped: true
    - id: isometric-dac
      registry: isometric
      label: Direct Air Capture
      mapped: false
    - id: isometric-ew
      registry: isometric
      label: Enhanced Weathering in Agriculture
      mapped: false

steps:
  # ── Validation: once per facility ────────────────────────────────────────

  - id: setup
    phase: validation
    label: Project setup
    sub: Name, place and date
    caption: The three facts every later step starts from.
    gate: Name, location and Commitment Date given.
    tasks:
      - id: setup.name
        kind: question
        label: Facility name
        ask: What is the facility called?
        why: The name opens every document and the registry listing.
        input: { type: text, placeholder: "e.g. Fujairah Peridotite Mineralisation" }
        cortex: none

      - id: setup.location
        kind: question
        label: Location
        ask: Where is the facility? Pick it on the globe, or type its latitude and longitude.
        why: Registries record WGS84 coordinates for every key location, and the host country decides which storage rules apply.
        input: { type: location }
        cortex: none

      - id: setup.commitment
        kind: question
        label: Commitment Date
        ask: What is the Commitment Date?
        why: The day you committed to the removal activity, such as signing the contract for the capture equipment. Registry deadlines run from it.
        rule: Puro GR 4.4 · Commitment Date
        input: { type: date }
        cortex: none

  - id: methodology
    phase: validation
    label: Methodology
    sub: Pathway, registry and rules
    caption: The choice here decides every requirement after it.
    gate: Pathway type, registry and a mapped methodology chosen.
    tasks:
      - id: methodology.category
        kind: question
        label: Pathway type
        ask: Is the removal nature-based or technology-based?
        why: It narrows the registries and methodologies that can certify it.
        input: { type: choice, source: categories }
        cortex: none

      - id: methodology.registry
        kind: question
        label: Registry
        ask: Which registry will certify it?
        why: Each registry gates the project differently and asks for evidence in its own form.
        input: { type: choice, source: registries }
        cortex:
          role: check
          check: registry-gate
          uses:
            - { id: protocols, doing: compares the registries }
            - { id: knowledge, doing: reads your location }

      - id: methodology.pick
        kind: question
        label: Methodology
        ask: Which methodology fits the activity?
        why: It fixes the credit equation, the documents and the monitoring rules for every step after this one.
        input: { type: choice, source: methodologies }
        cortex:
          role: check
          check: methodology-fit
          uses:
            - { id: protocols, doing: loads what the methodology requires }

  - id: onboarding
    phase: validation
    label: Registry onboarding
    sub: Qualify, KYC and sign
    caption: Get accepted by the registry and open the project there.
    gate: Registry checks passed, agreement signed and the project registered.
    by_registry:
      puro:
        sub: Qualification · KYC · Platform Agreement
        gate: Concept note accepted, KYC cleared, Platform Agreement signed, facility registered in MyPuro and storage jurisdiction settled.
      isometric:
        sub: KYC · Supplier Agreement · Certify
        gate: KYC cleared, Supplier Agreement signed and the project created in Certify with its forecast.
    tasks:
      - id: onboarding.other-schemes
        kind: question
        label: Other schemes
        ask: Has the project been registered, assessed or audited under another scheme?
        why: Registries ban double registration and ask about earlier certification attempts.
        input:
          type: choice
          options:
            - Never registered or assessed elsewhere
            - Registered or assessed elsewhere
            - Failed another scheme's audit in the last 3 years
        cortex:
          role: check
          check: other-schemes
          uses:
            - { id: protocols, doing: checks the registry's exclusion clause }
            - { id: knowledge, doing: keeps it for the concept note }
        by_registry:
          puro:
            why: Puro refuses a project that failed another scheme's audit in the past three years, and validated credits must stay exclusive.
            rule: CP v1.2 9.8.21
          isometric:
            why: Isometric asks you to disclose every scheme from the last five years.
            rule: R-Q3JN-0

      - id: onboarding.qualification
        kind: generate
        only: [puro]
        label: Project Concept Note
        ask: Shall I draft the Project Concept Note for Initial Qualification?
        why: Puro reads it first and can stop the project for lack of a methodology, negligible volumes or earlier audit failures.
        rule: CP v1.2 · Initial Qualification
        input: { type: draft }
        cortex:
          role: draft
          uses:
            - { id: knowledge, doing: gathers your answers }
            - { id: reports, doing: drafts the concept note }
        draft:
          needs: [setup.name, setup.location, setup.commitment, onboarding.other-schemes]
          lines:
            - "Project Concept Note — {setup.name}"
            - "Entity: [legal name of the CO₂ Removal Supplier]"
            - "Location: {location}"
            - "Methodology: {methodology}"
            - "Non-technical summary: [what is captured, how it moves and where it is stored]"
            - "Volume estimate: [CORCs a year]"
            - "Timeline: committed {setup.commitment}; first injection [date]; audit [date]"
            - "Earlier certification attempts: {onboarding.other-schemes}"
            - "Declaration: the project is not certified under any other scheme."

      - id: onboarding.preliminary
        kind: document
        only: [puro]
        optional: true
        label: Preliminary Assessment
        ask: Do you have Puro's Preliminary Assessment? Upload it here if you asked for one.
        why: Optional before operation. It confirms eligibility, finds gaps early and can list the project as a Future Facility.
        input: { type: file, accept: docs }
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files the assessment }
            - { id: verification, doing: lists the gaps it found }

      - id: onboarding.eligibility
        kind: document
        only: [isometric]
        optional: true
        label: Eligibility report
        ask: Do you have Isometric's eligibility report? Upload it here if you asked for one.
        why: Optional. Isometric reviews your design documents. For a cement kiln, ask first whether the source qualifies under BioCCS.
        input: { type: file, accept: docs }
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files the report }
            - { id: protocols, doing: reads the eligibility verdict }

      - id: onboarding.offtake
        kind: question
        only: [isometric]
        label: Buyer in place
        ask: Do you have a buyer signed for the credits?
        why: Isometric typically takes on a project that is already operating only with offtakes in place or above a minimum tonnage.
        rule: Isometric onboarding FAQ
        input:
          type: choice
          options: [Signed offtake, In negotiation, No buyer yet]
        cortex:
          role: check
          check: offtake
          uses:
            - { id: knowledge, doing: notes the offtake }

      - id: onboarding.kyc
        kind: document
        label: KYC
        ask: Upload the company documents for the registry's know-your-customer check.
        why: No registry signs an agreement before KYC clears.
        input: { type: file, accept: docs }
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files them for the registry }
            - { id: verification, doing: checks nothing is missing }
        by_registry:
          puro:
            label: KYB / KYC
            ask: Upload the company registration certificate, the register of shareholders, and the authorised representative's proof of signatory rights.
            why: Puro screens against EU and UN sanctions lists and World-Check, and KYC must clear before the Platform Agreement. One person should be the KYC'd representative, the signatory and the attesting signatory.
            rule: Puro KYB/KYC/AML Policies v1.2
          isometric:
            kind: question
            ask: Give the legal name, registered address, company number and industry sector.
            why: Isometric screens these four items against FATF high-risk jurisdictions, watchlists and UN sanctions.
            rule: Isometric KYC Policy v1.1
            input: { type: text, multiline: true, placeholder: "Legal name · registered address · company number · industry sector" }

      - id: onboarding.agreement
        kind: question
        label: Agreement signed
        ask: When was the registry agreement signed?
        why: Signing commits the project to the registry.
        input: { type: date }
        cortex: none
        by_registry:
          puro:
            label: Platform Agreement
            ask: When was the Platform Agreement signed?
            why: Signing fixes the methodology version, starts the €1,400 annual fee and opens the registry account.
            rule: CP v1.2 4.2.3
          isometric:
            label: Supplier Agreement
            ask: When were the Supplier Agreement and its project appendix signed?
            why: Signing commits the project to Isometric, assigns a Registry Operations Manager and produces the V&V schedule.

      - id: onboarding.registration
        kind: question
        label: Registry ID
        ask: What ID did the registry give the project?
        why: Every later submission refers to it.
        input: { type: text, placeholder: "Registry ID" }
        cortex: none
        by_registry:
          puro:
            label: MyPuro registration
            ask: What registry ID did MyPuro issue for the facility?
            why: Facility registration takes nine data items, including proof of ownership of or rights to the CORCs.
            rule: GR 3.1.2.1
          isometric:
            label: Certify project
            ask: What is the project's ID in Certify?
            why: The project in Certify holds the title, country, pathway, protocol and modules.

      - id: onboarding.summary
        kind: generate
        only: [isometric]
        label: Certify description
        ask: Shall I draft the project's Certify entry, with its description of 400 characters at most?
        why: Certify asks for a title, a short description, the country, pathway, protocol and modules.
        input: { type: draft }
        cortex:
          role: draft
          uses:
            - { id: knowledge, doing: gathers your answers }
            - { id: reports, doing: keeps it under 400 characters }
        draft:
          needs: [setup.name, setup.location, methodology.pick]
          lines:
            - "Certify project — {setup.name}"
            - "Location: {location}"
            - "Pathway: BioCCS · Protocol: {methodology}"
            - "Modules: {modules}"
            - "Description (400 characters at most): [what is captured, where, and how it is stored]"

      - id: onboarding.forecast
        kind: question
        only: [isometric]
        label: 24-month forecast
        ask: How many tonnes do you expect to issue over the next 24 months?
        why: Certify asks for an issuance forecast when the project is created.
        input: { type: number, unit: t }
        cortex:
          role: check
          uses:
            - { id: models, doing: compares it with the plant's capacity }

      - id: onboarding.jurisdiction
        kind: document
        only: [puro]
        label: Storage jurisdiction
        ask: Upload Puro's written approval of the host country's legal framework, or show the site is in a pre-approved jurisdiction.
        why: GSC accepts storage outright only in the USA, the EEA, the UK, Alberta, Saskatchewan and British Columbia. Elsewhere the framework must meet all eight rows of Table 1, and Puro decides before the audit.
        rule: GSC 3.2.11 · Table 1
        input: { type: file, accept: docs }
        cortex:
          role: check
          uses:
            - { id: protocols, doing: walks the eight Table 1 rows }
            - { id: evidence, doing: files Puro's approval }

  - id: package
    phase: validation
    label: Project documents
    sub: Evidence for the audit
    caption: Everything the auditor will read, in the registry's own form.
    gate: Every required document filed and checked.
    by_registry:
      puro:
        sub: 11-module audit package
        caption: Puro's templates, grouped as its Audit Document Index lists them.
        gate: Every module of the audit package filed, and the index and declarations drafted.
      isometric:
        label: Project design
        sub: PDD and LCA in Certify
        caption: Certify's requirement list, answered in writing with evidence.
        gate: Every Certify requirement answered, so the progress bar allows submission.
    tasks:
      - id: package.description
        kind: generate
        only: [puro]
        label: Project Description
        ask: Shall I draft the Project Description on template v2.1?
        why: It covers 11 items within hard word limits, gives WGS84 coordinates for every key location, and is published.
        rule: GR 2.2.4.2 · PD template v2.1
        input: { type: draft }
        cortex:
          role: draft
          uses:
            - { id: knowledge, doing: gathers your answers }
            - { id: protocols, doing: keeps to the word limits }
            - { id: reports, doing: drafts the description }
        draft:
          needs: [setup.name, setup.location, methodology.pick]
          lines:
            - "Project Description (template v2.1) — {setup.name}"
            - "1. Name, location, methodology and supplier: {setup.name} · {location} · {methodology}"
            - "2. Non-technical description (200 words at most): [to write]"
            - "3. Technical description (500 words at most): [from the site descriptions]"
            - "4. Quantification with uncertainty (300 words at most): [from the LCA]"
            - "5. Reversal risk: [from the storage monitoring plan]"
            - "6. Conformity to the methodology: [to write]"
            - "7. Monitoring plan: {mark:package.monitoring}"
            - "8. Baseline and additionality: {mark:package.additionality}"
            - "9. Stakeholder consultation: {mark:package.stakeholders}"
            - "10. Environmental and social safeguards: {mark:package.safeguards}"
            - "11. SDG impacts (150 words at most): {mark:package.sdg}"
            - "Signed by an individual with legal signing authority."

      - id: package.pdd
        kind: generate
        only: [isometric]
        label: PDD · project setup
        ask: Shall I draft the Project setup section of the PDD?
        why: VVBs raise an issue against any sub-requirement left unanswered, and attachments don't replace a written answer.
        rule: Isometric Standard §3.2
        input: { type: draft }
        cortex:
          role: draft
          uses:
            - { id: knowledge, doing: gathers your answers }
            - { id: reports, doing: answers each requirement }
        draft:
          needs: [setup.name, setup.location, onboarding.kyc, onboarding.forecast]
          lines:
            - "PDD · Project setup — {setup.name}"
            - "Technologies (R-7X0X-1): [capture, liquefaction, transport, injection]"
            - "Role of each location (R-A5B6-0): {location} · [capture site] · [storage site]"
            - "Organisations, company numbers and contacts (R-F6R7-0): {onboarding.kyc}"
            - "Expected removals (R-XT6V-1): {onboarding.forecast} t over 24 months"

      - id: package.source
        kind: document
        only: [isometric]
        label: Capture source
        ask: Upload the BioCCS process diagram, solvent use and CO₂ purity, and the estimated biogenic fraction.
        why: The PDD must carry an estimated average F_B at validation.
        rule: G-JSJB-0 · R-0T9J-0
        input: { type: file, accept: docs-sheets }
        blocks: true
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files the diagram }
            - { id: models, doing: reads the estimated F_B }

      - id: package.fossil-share
        kind: question
        only: [isometric]
        label: Fossil share
        ask: What share of the kiln's feedstock mass is fossil fuel?
        why: BioCCS v1.5 asks for a justification wherever fossil fuel exceeds 5% of feedstock mass.
        rule: R-YJJC-0
        input: { type: number, unit: "%" }
        cortex:
          role: check
          check: fossil-share
          uses:
            - { id: protocols, doing: checks the 5% limit }
            - { id: datasets, doing: compares fuel records }

      - id: package.feedstock
        kind: document
        only: [isometric]
        label: Feedstock accounting
        ask: Upload the feedstock evidence for Biomass Feedstock Accounting.
        why: Each supplier's registration and payment declaration, EWC codes and waste transfer notes, a 3- or 5-year counterfactual, market leakage, and a waste hierarchy showing only unrecyclable waste is burned.
        rule: BFA v1.4 · R-Q8V2-0
        input: { type: file, accept: docs-sheets }
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files the records }
            - { id: verification, doing: matches suppliers to declarations }

      - id: package.additionality
        kind: document
        label: Baseline and additionality
        ask: Upload the baseline and additionality evidence.
        why: The auditor tests that the removal would not happen without credits.
        input: { type: file, accept: docs-sheets }
        cortex:
          role: check
          uses:
            - { id: protocols, doing: walks the additionality tests }
            - { id: evidence, doing: files it for the VVB }
        by_registry:
          puro:
            ask: Upload the Baseline and Additionality Questionnaire v2.0 and the Production Facility Definition and Baseline workbook.
            why: Regulatory test, Commitment Date, common practice, other income, then exactly one of cost, investment or barrier analysis, with unlocked spreadsheets. The baseline is bio-CCS Retrofit unless capture came within 48 months of plant start-up.
            rule: GSC 3.4.3–3.4.4
          isometric:
            why: The no-project scenario under current law, new-build or retrofit, and four tests (financial over 10 years with ±20% scenarios, common practice, regulatory, environmental), plus additionality of the CCS itself.
            rule: R-PGFH-1 · G-6EE0-0 · R-983D-0 · R-CDNF-1

      - id: package.lca
        kind: document
        label: LCA
        ask: Upload the life-cycle assessment.
        why: The LCA sets the project emissions subtracted from every credit.
        input: { type: file, accept: sheets }
        cortex:
          role: check
          uses:
            - { id: models, doing: links LCA inputs to meters }
            - { id: protocols, doing: checks the method version }
        by_registry:
          puro:
            ask: Upload the LCA model workbook.
            why: GSC v5 amortises over 15 or 20 years and attributes transport and storage emissions by mass balance. Follow the LCA Guidelines for Suppliers.
            rule: GSC 2024 v5 · LCA Guidelines
          isometric:
            label: LCA in Certify
            ask: Upload the export of the LCA built in Certify, with its sensitivity analysis.
            why: Amortisation is capped at 20 years, each excluded source must be under 1%, grid factors use the residual mix, and every parameter needs a sensitivity analysis.
            rule: GHG Accounting v1.1 · Energy Use v1.3 · R-2AVD-1

      - id: package.monitoring
        kind: document
        label: Monitoring plan
        ask: Upload the monitoring plan and the storage monitoring plan.
        why: The auditor checks every term of the credit equation can be measured.
        input: { type: file, accept: docs-sheets }
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files the plans }
            - { id: datasets, doing: maps meters to the plan }
            - { id: calibration, doing: checks each meter is listed }
        by_registry:
          puro:
            ask: Upload the monitoring plan, the storage monitoring plan, screenshots of the working data system and the uncertainty workbook in Excel.
            why: A scope of work for the data system isn't enough; the auditor wants to see it running.
          isometric:
            ask: Upload the monitoring plan and data approach, and the storage monitoring plan following the module's Tables A1–A3.
            why: Laboratories must be accredited to ISO/IEC 17025.
            rule: R-GYA1-0 · R-1HWS-0

      - id: package.sites
        kind: document
        only: [puro]
        label: Site descriptions
        ask: Upload the capture site, logistic chain and storage site descriptions, with the biomass sourcing form and the radiocarbon sampling plan.
        why: Puro's templates describe each part of the chain, and the capture module needs Puro's own biomass sourcing form, not a summary.
        rule: Audit index · modules 04–06
        input: { type: file, accept: docs-sheets }
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files each module }
            - { id: verification, doing: matches them to the index }

      - id: package.storage
        kind: document
        only: [isometric]
        label: Storage baseline and risk
        ask: Upload the storage baseline and the Risk of Reversal questionnaire.
        why: Divalent cation content, reactive surface area, a regional seismicity study and a PHREEQC bubble-point calculation, plus the durability threshold.
        rule: In-situ Mineralization v1.2 · R-7C8E-1
        input: { type: file, accept: docs-sheets }
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files the studies }
            - { id: models, doing: reads the bubble point }

      - id: package.permits
        kind: document
        label: Permits
        ask: Upload the permits for every installation and the storage approval.
        why: The storage must be legal in every jurisdiction it touches.
        input: { type: file, accept: docs }
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files the permits }
            - { id: schedules, doing: watches expiry dates }
        by_registry:
          puro:
            ask: Upload the permits for every installation, including the haulier, dangerous-goods and liquefied-CO₂ storage permits, and the approval for permanent geological storage.
            why: Local no-objection certificates will be tested against the permanent-storage requirement and may fall short.
            rule: GSC 3.3.3 · 7.5.1
          isometric:
            ask: Upload the well permit naming CO₂ as an acceptable injectant. Outside US Class VI, the EU CCS Directive, Norway, the UK and Alberta Directive 064, add a licensed geoscientist's seven-part report.
            why: The report covers site characterisation, area-of-review modelling, the risk register, monitoring, well integrity, equivalence to the listed permits and an SRMS maturity opinion.
            rule: R-JYE5-0 · G-X88M-0 · R-KQCS-0

      - id: package.operators
        kind: document
        only: [puro]
        label: Operators and contracts
        ask: Upload certified trade registry extracts for you and every external operator, and the contracts between you.
        why: The contracts must split monitoring, leakage-response and closure costs and give you the right to audit the capture operator, haulier and storage operator.
        rule: GSC 3.3.1 · 3.3.4 · 3.3.5
        input: { type: file, accept: docs }
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files the extracts }
            - { id: verification, doing: checks the contract clauses }

      - id: package.ownership
        kind: generate
        label: Ownership
        ask: Shall I draft the ownership statement?
        why: The registry needs proof you own the removals and may sell the credits.
        input: { type: draft }
        cortex:
          role: draft
          uses:
            - { id: knowledge, doing: reads the supplier details }
            - { id: reports, doing: drafts the statement }
        draft:
          needs: [setup.name]
          lines:
            - "Statement of CO₂ Removal ownership and audit authorisation"
            - "[Supplier] holds exclusive rights to the CO₂ removals of {setup.name} and to the {credits} issued for them."
            - "[Supplier] authorises the VVB the registry appoints to audit the facility and every operator in the chain."
            - "Signed: ____________________   Date: ____________"
        by_registry:
          puro:
            label: Ownership statement
            why: The signed Statement of CO₂ Removal ownership and audit authorisation sits in 01 Administrative.
          isometric:
            kind: document
            label: Ownership and contracts
            ask: Upload proof of legal ownership and the contracts with partners.
            why: One Project Proponent named as sole owner, and contracts in which partners give up claims and grant data access.
            rule: R-M858-1 · G-0KA1-1 · G-TTWW-0
            input: { type: file, accept: docs }
            cortex:
              role: check
              uses:
                - { id: evidence, doing: files the contracts }
                - { id: verification, doing: checks the claims are waived }

      - id: package.safeguards
        kind: document
        label: Safeguards
        ask: Upload the environmental and social safeguards evidence.
        why: The project must do no net harm to people or the environment.
        input: { type: file, accept: docs }
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files it for the VVB }
            - { id: verification, doing: checks every answer has evidence }
        by_registry:
          puro:
            ask: Upload the ESS Questionnaire v2.2 with its evidence, the EIA, the chemical plan and the water-use plan.
            why: Each Yes/No answer needs evidence behind it, the chemical plan must cover amines and spills, and water rights need a standalone plan.
            rule: GSC 3.8.5–3.8.6
          isometric:
            ask: Upload the EIA or SIA, the no-net-harm and closure plan, the leak alarm and leak-response plans, and water use against WRI Aqueduct.
            why: Interim storage and transport need audible leak alarms, and the response plan must be shared with first responders.
            rule: R-6VFZ-0 · G-1T3C-0 · R-8K1S-1 · R-W7XE-1 · R-AVC2-2

      - id: package.stakeholders
        kind: document
        label: Stakeholder consultation
        ask: Upload the stakeholder consultation report.
        why: Local people must be invited to comment, with a way to raise grievances.
        input: { type: file, accept: docs }
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files the report }
            - { id: schedules, doing: checks it ran 14 days }
        by_registry:
          puro:
            ask: Upload the Stakeholder Engagement Report.
            why: Run after registration approval and before the audit, for at least 14 days, with six invitee groups, a sample invitation and a grievance channel.
            rule: Puro SEP Requirements
          isometric:
            why: At least 14 days' notice in the local language; grievances acknowledged within 14 days and resolved within 60. Isometric also runs its own public comment period later.
            rule: Standard §3.8 · G-JNW9-0 · R-E579-0

      - id: package.sdg
        kind: document
        only: [puro]
        label: SDG report
        ask: Upload the SDG reporting template and its evidence.
        why: Each SDG claimed beyond SDG 13 needs its own evidence folder.
        rule: SDG template v1.2
        input: { type: file, accept: docs }
        cortex: none

      - id: package.host-country
        kind: question
        label: Host country
        ask: Does the activity fall within the host country's NDC?
        why: It decides whether the host country must authorise the credits.
        input:
          type: choice
          options: [Inside the NDC, Outside the NDC, Not sure yet]
        cortex:
          role: check
          check: host-country
          uses:
            - { id: protocols, doing: reads the NDC rules }
            - { id: reports, doing: writes the conclusion }
        by_registry:
          puro:
            why: Puro asks for an NDC evaluation, and Article 6 authorisation if the activity falls within the NDC.
            rule: GSC 3.6.2
          isometric:
            why: Isometric asks for a statement that the project is compatible with net zero and the NDC. A Letter of Authorization is needed only for CORSIA.
            rule: R-S9BB-0

      - id: package.index
        kind: generate
        only: [puro]
        label: Audit Document Index
        ask: Shall I build the Audit Document Index, the Template Version Declaration and the auditor contact workbook?
        why: The index groups the evidence into 11 modules, and the declaration tells the auditor which template versions you used.
        input: { type: draft }
        cortex:
          role: draft
          uses:
            - { id: verification, doing: matches documents to modules }
            - { id: reports, doing: writes the index }
        draft:
          needs: [package.description, package.additionality, package.lca, package.monitoring, package.sites, package.permits, package.operators, package.ownership, package.safeguards, package.stakeholders]
          lines:
            - "Audit Document Index — {methodology}"
            - "{mark:package.ownership}"
            - "{mark:package.operators}"
            - "{mark:package.additionality}"
            - "{mark:package.safeguards}"
            - "{mark:package.sites}"
            - "{mark:package.permits}"
            - "{mark:package.monitoring}"
            - "{mark:package.lca}"
            - "{mark:package.sdg}"
            - "{mark:package.description}"
            - "Template Version Declaration: current templates"
            - "Contact information to auditor: [to fill]"

  - id: validation
    phase: validation
    label: Validation
    sub: Registry review and VVB audit
    caption: The registry reviews the package, then a VVB it appoints and pays audits the project.
    gate: The VVB's report accepted and the project marked Validated.
    by_registry:
      puro:
        sub: Puro review · VVB audit
        gate: Validation report accepted after Puro's internal review.
      isometric:
        sub: Public comment · VVB audit
        gate: Combined V&V report accepted after Isometric's quality review.
    tasks:
      - id: validation.remi
        kind: question
        only: [isometric]
        label: Remi issues
        ask: How many issues raised by Remi are still open?
        why: Request validation stays disabled until every issue Isometric's checker raised is resolved or disputed.
        input: { type: number, unit: open }
        cortex:
          role: check
          check: remi-issues
          uses:
            - { id: verification, doing: reads Remi's issue list }

      - id: validation.review
        kind: question
        label: Registry review
        ask: Where is the registry's review of the package?
        why: The registry checks the package before it appoints an auditor.
        input:
          type: choice
          options: [Submitted, Changes requested, Passed]
        cortex:
          role: check
          check: review-status
          uses:
            - { id: reviewer, doing: tracks the review rounds }
        by_registry:
          puro:
            label: Completeness review
            why: Puro checks the package is complete and sufficient before it allocates a VVB, and can deregister a project still insufficient after several rounds.
            rule: CP v1.2 5.2.1–5.2.4
          isometric:
            label: Isometric pre-screen
            why: Isometric's scientists approve the submission in rounds until every issue is closed.

      - id: validation.comment
        kind: question
        only: [isometric]
        label: Public comment
        ask: When does the public comment period on the redacted PDD run?
        why: Isometric publishes the redacted PDD for 10 days, extended to 30 if material comments arrive.
        input: { type: period }
        cortex:
          role: check
          check: public-comment
          uses:
            - { id: schedules, doing: counts the days }
            - { id: reviewer, doing: collects the comments }

      - id: validation.window
        kind: question
        only: [puro]
        label: Audit date
        ask: When is the validation audit booked?
        why: Validation must come within 3 years of the Commitment Date, or 5 for geological storage such as BioCCS. The two rules conflict, so get Puro's written ruling.
        rule: GR 2.2.3 · CP v1.2 5.3.9
        input: { type: date }
        cortex:
          role: check
          check: validation-window
          uses:
            - { id: protocols, doing: checks the validation window }
            - { id: schedules, doing: warns before it closes }

      - id: validation.combined
        kind: question
        only: [puro]
        label: First verification
        ask: Will the first verification run alongside the validation?
        why: Puro won't validate before CO₂ is injected, so the usual plan is a short first monitoring period audited together with validation.
        rule: CP v1.2 5.4.4
        input:
          type: choice
          options: [Combined with validation, Validation only]
        cortex: none

      - id: validation.vvb
        kind: question
        label: VVB
        ask: Which VVB will audit the project?
        why: The registry appoints and pays the VVB. A VVB that advised on the project can't audit it.
        input: { type: text, placeholder: "VVB name" }
        cortex: none
        by_registry:
          puro:
            ask: Which VVB did Puro allocate? Confirm you accept it.
            rule: CP v1.2 5.2.2
          isometric:
            ask: Which VVB won Isometric's RFP?
            why: Isometric contracts the winner. One VVB may audit no more than five consecutive years, and no more than five of any seven.
            rule: Isometric VVB Policy v1.2

      - id: validation.ghg-statement
        kind: document
        only: [isometric]
        label: First GHG statement
        ask: Upload the first GHG statement, with its sensitivity analysis and written report.
        why: It goes in before the site visit, and every GHG entry in it must be net-negative on its own.
        input: { type: file, accept: docs-sheets }
        blocks: true
        cortex:
          role: check
          uses:
            - { id: models, doing: checks each entry is net-negative }
            - { id: reports, doing: files the statement }

      - id: validation.visit
        kind: question
        label: Site visit
        ask: When is the VVB's site visit?
        why: The VVB must see the plant running as usual.
        input: { type: date }
        cortex: none
        by_registry:
          isometric:
            why: One to two days per key location, usually after the GHG statement is in.

      - id: validation.findings
        kind: question
        label: Findings
        ask: What did the VVB find?
        why: Findings must be closed before the project is validated.
        input:
          type: choice
          options: [No findings, Minor findings only, Major findings, Critical findings]
        cortex:
          role: check
          check: findings
          uses:
            - { id: reviewer, doing: pairs findings and answers }
            - { id: violations, doing: tracks each to closure }
        by_registry:
          puro:
            why: A critical or major non-conformity at validation rejects the project, and it can re-apply only after 12 months.
            rule: CP v1.2 section 6
          isometric:
            why: Every ISO 14064-3 issue must close before validation, except Forward Action Requests. Where a requirement doesn't fit, Isometric may approve an Explanatory Note.

      - id: validation.report
        kind: document
        label: Validation report
        ask: Upload the validation report once the registry has accepted it.
        why: Acceptance marks the project Validated.
        input: { type: file, accept: docs }
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files the report }
            - { id: reviewer, doing: closes the validation }
        by_registry:
          puro:
            why: Puro always runs a full internal review for a new client, methodology or VVB before the status moves to Validated.
          isometric:
            label: V&V report
            ask: Upload the combined V&V report once Isometric has quality-reviewed it.
            why: It usually arrives 6–8 weeks after the site visit.

  - id: listed
    phase: validation
    label: Project validated
    sub: Crediting period starts
    caption: The crediting period runs for 15 years from here.
    gate: Crediting start and reporting rhythm agreed.
    by_registry:
      puro:
        sub: Listed on Puro
      isometric:
        sub: Validated on Isometric
    tasks:
      - id: listed.date
        kind: question
        label: Validated on
        ask: When did the registry mark the project Validated?
        why: The validation date goes on every credit's record.
        input: { type: date }
        cortex: none

      - id: listed.crediting
        kind: question
        label: Crediting start
        ask: When does the crediting period start?
        why: The crediting period runs for 15 years.
        input: { type: date }
        cortex:
          role: check
          check: crediting-start
          uses:
            - { id: protocols, doing: checks the start date }
            - { id: schedules, doing: counts the 15 years }
        by_registry:
          puro:
            why: It starts on the first day of the first monitoring period and runs 15 years, renewable twice. Injections before it earn nothing.
          isometric:
            why: It can start up to 5 years before the first registry submission and runs 15 years, renewable after re-validation.

      - id: listed.forecast
        kind: question
        only: [puro]
        label: Yearly forecast
        ask: How many CORCs a year do you expect?
        why: Volume decides how many output reports a year Puro allows and the per-CORC fee tier.
        input: { type: number, unit: CORCs a year }
        cortex:
          role: check
          uses:
            - { id: models, doing: projects CORCs a year }
            - { id: protocols, doing: finds the fee tier }

      - id: listed.cadence
        kind: question
        label: Reporting rhythm
        ask: How often will you report?
        why: Report at least once every 12 months.
        input:
          type: choice
          options: [Once a year, Twice a year, Four times a year, Every month]
        cortex:
          role: check
          check: cadence
          uses:
            - { id: protocols, doing: checks the volume tier }
            - { id: schedules, doing: sets the reporting clock }
        by_registry:
          puro:
            why: Below 10,000 CORCs a year Puro allows one output report a year. More often needs Issuance Plus, with at least 1,000 CORCs per audit.
          isometric:
            why: Verification at least once a year; Isometric markets monthly issuance.

      - id: listed.buffer
        kind: question
        only: [isometric]
        label: Buffer
        ask: Is the storage under a regime Isometric treats as equivalent, such as the EU CCS Directive?
        why: The buffer is 1% of each issuance, or 0% under a recognised equivalent regime.
        input:
          type: choice
          options: [Recognised equivalent regime, Not recognised]
        cortex:
          role: check
          check: buffer
          uses:
            - { id: protocols, doing: sets the buffer share }

  # ── Verification: every monitoring period ────────────────────────────────

  - id: monitor
    phase: verification
    label: Monitor
    sub: Monitor and meter
    caption: Measure every term of the credit equation for the whole period.
    gate: Every term of the credit equation measured for the period.
    tasks:
      - id: monitor.period
        kind: question
        label: Period dates
        ask: Which dates does this monitoring period cover?
        why: Every reading is cut to these dates.
        input: { type: period }
        cortex:
          role: check
          check: period-length
          uses:
            - { id: protocols, doing: checks the period length }
            - { id: schedules, doing: opens the period clock }
        by_registry:
          puro:
            why: The first period can run up to 18 months (GR 2.4.2) or 24 (CP 5.4.5); after that an output report is due at least every 12 months.
          isometric:
            why: The first period can start from the validated start date; after that, verify at least once a year.

      - id: monitor.injected
        kind: question
        label: CO₂ injected
        ask: How much CO₂ was injected at the last point of measurement?
        why: C_injected is where the stored-carbon calculation starts.
        input: { type: number, unit: t }
        blocks: true
        cortex:
          role: check
          uses:
            - { id: datasets, doing: reads the wellhead meters }
            - { id: rules, doing: checks limits and gaps }
            - { id: anomaly, doing: compares the meters }
            - { id: calibration, doing: checks the meter is calibrated }

      - id: monitor.chain
        kind: document
        label: Chain reconciliation
        ask: Upload the capture outlet totals, the truck loading and unloading tickets and the wellhead totals.
        why: Three reconciled metering points close the custody gap of road transport.
        input: { type: file, accept: sheets }
        blocks: true
        cortex:
          role: check
          uses:
            - { id: connectors, doing: pulls the totalisers }
            - { id: datasets, doing: aligns every stream's start }
            - { id: anomaly, doing: spots losses between steps }
        by_registry:
          puro:
            why: The chain tolerance is 5%, the haulier documents the tonnes delivered, and any leak after the last meter counts as E_released.
            rule: GSC 7.2.8–7.2.9 · 7.4.4(b)
          isometric:
            why: The tolerance is 2%, with batch weighing or tank gauging recorded at loading and at receipt.

      - id: monitor.biogenic
        kind: document
        label: Biogenic fraction
        ask: Upload the radiocarbon results for the captured stream.
        why: Only biogenic CO₂ earns credits, and a kiln mixes biomass, fossil fuel and limestone.
        input: { type: file, accept: docs-sheets }
        blocks: true
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files the lab results }
            - { id: models, doing: sets the eligible fraction }
        by_registry:
          puro:
            why: F_eligible source is measured by radiocarbon (ISO 13833 or ASTM D6866) at least twice a year, then multiplied by the eligible-biomass fraction.
            rule: "GSC 4.4.5 · Clarification #022"
          isometric:
            why: Method A — continuous flue-gas sampling proportional to stack flow, integrated over at most three months, with radiocarbon analysis — sets F_B.

      - id: monitor.feedstock
        kind: document
        label: Feedstock records
        ask: Upload the period's biomass delivery records.
        why: Every delivery must be traceable to an eligible source.
        input: { type: file, accept: sheets }
        blocks: true
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files the delivery records }
            - { id: protocols, doing: checks eligible categories }
            - { id: verification, doing: matches suppliers to records }
        by_registry:
          puro:
            why: RDF (category A) needs an ID, date, amount, waste type, area and delivering entity for every delivery; wood (category C) also its grade. Tyres have no category, so exclude them or get Puro's acceptance.
            rule: Biomass Sourcing Criteria v1.3
          isometric:
            why: Per-supplier records with EWC codes and waste transfer notes. More than 10 source lots needs a sampling plan Isometric approved first.
            rule: BFA v1.4

      - id: monitor.energy
        kind: document
        label: Energy and fuel
        ask: Upload the period's electricity, fuel and transport records.
        why: They set the project emissions subtracted from the stored carbon.
        input: { type: file, accept: sheets }
        blocks: true
        cortex:
          role: check
          uses:
            - { id: datasets, doing: sums each meter }
            - { id: rules, doing: checks every meter is complete }
            - { id: anomaly, doing: flags meters stuck at zero }
        by_registry:
          isometric:
            why: Grid electricity uses residual-mix factors, and transport emissions should come from fuel invoices rather than distance.
            rule: Energy Use v1.3 · GHG Accounting v1.1

      - id: monitor.bubble-point
        kind: question
        label: Bubble-point margin
        ask: What was the lowest reservoir pressure margin above the bubble point this period?
        why: Pressure must stay more than 5 bar above the bubble point, checked at least monthly.
        input: { type: number, unit: bar }
        blocks: true
        cortex:
          role: check
          check: bubble-point
          uses:
            - { id: datasets, doing: reads the reservoir pressure }
            - { id: rules, doing: checks the 5 bar margin }
            - { id: anomaly, doing: finds the lowest margin }
        by_registry:
          puro:
            why: Pressure must stay more than 5 bar above the bubble point, checked at least monthly. CO₂ injected while the margin is breached counts as a reversal.

      - id: monitor.storage
        kind: document
        label: Storage monitoring
        ask: Upload the period's storage monitoring results.
        why: They show the CO₂ stays where it was injected.
        input: { type: file, accept: docs-sheets }
        cortex:
          role: check
          uses:
            - { id: datasets, doing: reads the monitoring wells }
            - { id: rules, doing: checks no reading is missing or late }
        by_registry:
          puro:
            why: Continuous CO₂ and water mass flow, quarterly composition checks, monthly leak inspection and periodic corrosion monitoring.
          isometric:
            why: Daily injectate pH, weekly formation fluid, monthly reactive tracer, quarterly corrosion, an annual mechanical integrity test and a fall-off test every two years.
            rule: In-situ Mineralization v1.2

      - id: monitor.calibration
        kind: document
        label: Calibration
        ask: Upload the calibration certificates for every meter and lab used this period.
        why: An uncalibrated meter can't be used for credits.
        input: { type: file, accept: docs }
        cortex:
          role: check
          uses:
            - { id: calibration, doing: checks every meter's date }
            - { id: evidence, doing: files the certificates }
        by_registry:
          isometric:
            why: Laboratories must be accredited to ISO/IEC 17025.

      - id: monitor.reversal
        kind: question
        label: Reversals
        ask: Was there any reversal or leak this period?
        why: A reversal must be reported to the registry quickly.
        input:
          type: choice
          options: [No reversal, Reversal reported to the registry, Reversal not yet reported]
        cortex:
          role: check
          check: reversal-notice
          uses:
            - { id: anomaly, doing: looks for a reversal }
            - { id: violations, doing: raises it in time }
        by_registry:
          puro:
            why: Report a reversal to Puro within 5 days.
          isometric:
            why: Report a reversal to Isometric within 1 business day, 3 at most.

  - id: report
    phase: verification
    label: Report
    sub: Credits for the period
    caption: Turn the period's measurements into credits.
    gate: Credit calculation complete, with nothing it depends on missing.
    by_registry:
      puro:
        label: Output report
        sub: CORC report for the period
        gate: CORC calculation and monitoring report complete.
      isometric:
        label: GHG statement
        sub: GHG entries for the period
        gate: GHG entries and statement ready for the VVB.
    tasks:
      - id: report.balance
        kind: generate
        only: [puro]
        label: CO₂ balance
        ask: Shall I build the period's CO₂ balance?
        why: C_stored = (C_injected − E_released) × F_eligible × F_supplier.
        input: { type: draft }
        blocks: true
        cortex:
          role: draft
          uses:
            - { id: models, doing: builds the balance }
            - { id: anomaly, doing: explains the gaps }
        draft:
          needs: [monitor.injected, monitor.chain, monitor.biogenic, monitor.feedstock]
          lines:
            - "CO₂ balance — {period}"
            - "C_injected at the last meter: {monitor.injected} t"
            - "{mark:monitor.chain}"
            - "{mark:monitor.biogenic}"
            - "{mark:monitor.feedstock}"
            - "Test: eligible CO₂ injected ≤ eligible CO₂ captured in the same period"

      - id: report.ghg-entries
        kind: generate
        only: [isometric]
        label: GHG entries
        ask: Shall I build the period's GHG entries?
        why: Each entry is issued as its own batch in kilograms, must be net-negative on its own, and takes its vintage from the year it ends.
        input: { type: draft }
        blocks: true
        cortex:
          role: draft
          uses:
            - { id: models, doing: builds each entry }
            - { id: datasets, doing: reads the period's meters }
        draft:
          needs: [monitor.injected, monitor.chain, monitor.biogenic, monitor.energy]
          lines:
            - "GHG entries — {period}"
            - "CO₂ injected: {monitor.injected} t"
            - "{mark:monitor.biogenic}"
            - "{mark:monitor.chain}"
            - "{mark:monitor.energy}"
            - "Each entry net-negative: [checked when the LCA runs]"

      - id: report.lca
        kind: generate
        label: LCA update
        ask: Shall I re-run the LCA with this period's metered values?
        why: Forecast inputs are replaced by what was measured.
        input: { type: draft }
        blocks: true
        cortex:
          role: draft
          uses:
            - { id: models, doing: re-runs the LCA }
            - { id: datasets, doing: swaps in metered values }
        draft:
          needs: [monitor.energy, monitor.chain]
          lines:
            - "LCA update — {period}"
            - "{mark:monitor.energy}"
            - "{mark:monitor.chain}"
            - "{mark:monitor.biogenic}"
            - "Allocate project emissions to the eligible CO₂"

      - id: report.uncertainty
        kind: document
        label: Uncertainty
        ask: Upload the updated uncertainty assessment.
        why: Credits rest on conservative estimates.
        input: { type: file, accept: sheets }
        cortex:
          role: check
          uses:
            - { id: models, doing: applies the conservative estimate }
        by_registry:
          puro:
            why: Quantification uses conservative estimates, with the uncertainty updated every year.
          isometric:
            why: Credits use a conservative estimate, the 16th percentile or one standard deviation below the mean.

      - id: report.corc
        kind: generate
        only: [puro]
        label: CORC calculation
        ask: Shall I run the CORC equation for the period?
        why: CORCs = C_stored − E_project − E_leakage − E_reversal, in whole tonnes.
        input: { type: draft }
        blocks: true
        cortex:
          role: draft
          uses:
            - { id: models, doing: runs the CORC equation }
            - { id: runs, doing: scores data readiness }
        draft:
          needs: [report.balance, report.lca, monitor.reversal, monitor.bubble-point]
          lines:
            - "CORCs = C_stored − E_project − E_leakage − E_reversal"
            - "C_stored = (C_injected − E_released) × F_eligible × F_supplier"
            - "C_injected: {monitor.injected} t"
            - "{mark:report.balance}"
            - "{mark:report.lca}"
            - "{mark:monitor.reversal}"
            - "{mark:monitor.bubble-point}"
            - "Fractions under one tonne carry to the next issuance."

      - id: report.statement
        kind: generate
        label: Period report
        ask: Shall I draft the report for the period?
        why: The report the VVB verifies.
        input: { type: draft }
        cortex:
          role: draft
          uses:
            - { id: reports, doing: writes it up }
            - { id: verification, doing: checks every term is evidenced }
        draft:
          needs: [report.lca, report.uncertainty]
          lines:
            - "{registry} report — {period}"
            - "{mark:report.balance}"
            - "{mark:report.ghg-entries}"
            - "{mark:report.lca}"
            - "{mark:report.uncertainty}"
            - "{mark:report.corc}"
        by_registry:
          puro:
            label: Monitoring report
            why: Puro publishes it. Pricing, personal data and security details may be redacted; equations, parameters, spreadsheets, baseline, uncertainty and leakage may not.
          isometric:
            label: GHG statement
            why: Isometric publishes each entry's calculation and datapoints, but never exact latitude and longitude.

  - id: audit
    phase: verification
    label: Verification
    sub: VVB audit of the period
    caption: A VVB verifies the period's report.
    gate: Verification statement accepted.
    by_registry:
      puro:
        label: Output audit
        sub: VVB verification · Puro review
      isometric:
        sub: VVB verifies the statement
    tasks:
      - id: audit.package
        kind: generate
        only: [puro]
        label: Output audit package
        ask: Shall I bundle the output audit package?
        why: The auditor works from the Output Audit framework.
        input: { type: draft }
        cortex:
          role: draft
          uses:
            - { id: verification, doing: checks every checkpoint }
            - { id: reports, doing: bundles the package }
        draft:
          needs: [report.corc, report.statement]
          lines:
            - "Output audit package — {period}"
            - "Framework: Output Audit"
            - "{mark:report.corc}"
            - "{mark:report.statement}"
            - "{mark:report.uncertainty}"

      - id: audit.fee
        kind: question
        only: [puro]
        label: Audit size
        ask: How many CORCs will this audit cover?
        why: An audit yielding 1,000 CORCs or fewer is invoiced a flat €12,000 when it is booked, before any credit exists. Above that, per-CORC fees fall due at sale.
        rule: Puro fees
        input: { type: number, unit: CORCs }
        cortex:
          role: check
          check: audit-fee
          uses:
            - { id: models, doing: estimates the CORCs }
            - { id: protocols, doing: picks the fee }

      - id: audit.submitted
        kind: question
        only: [isometric]
        label: Submitted
        ask: When was the GHG statement submitted for verification?
        why: Verification follows the submission.
        input: { type: date }
        cortex: none

      - id: audit.visit
        kind: question
        label: Site visit
        ask: When is the VVB's site visit, if there is one?
        why: The VVB decides whether it needs to see the site.
        input: { type: date }
        cortex: none
        by_registry:
          puro:
            why: For frequent output audits the auditor may decide no site visit is needed.
            rule: "Clarification #028"

      - id: audit.findings
        kind: question
        label: Findings
        ask: What did the VVB find?
        why: Findings must be closed before credits are issued.
        input:
          type: choice
          options: [No findings, Minor findings only, Major findings, Critical findings]
        cortex:
          role: check
          check: findings
          uses:
            - { id: reviewer, doing: pairs findings and answers }
            - { id: schedules, doing: counts the days to fix them }
        by_registry:
          puro:
            why: Major findings at verification suspend the Certificate of Compliance; fix them within 90 days or the project is withdrawn.
          isometric:
            why: Every issue must close before issuance, except Forward Action Requests.

      - id: audit.statement
        kind: document
        label: Verification statement
        ask: Upload the verification statement once the registry has reviewed it.
        why: The registry issues credits on it.
        input: { type: file, accept: docs }
        cortex:
          role: check
          uses:
            - { id: evidence, doing: files the statement }
            - { id: reviewer, doing: closes the audit }
        by_registry:
          puro:
            why: VVB reports reach Puro before they reach you, and Puro reviews them before issuing.
          isometric:
            label: VVB report
            why: Isometric quality-reviews the VVB's report before it issues.

  - id: issued
    phase: verification
    label: Credits issued
    sub: On the registry
    caption: Credits land in your registry account; the next period begins.
    gate: Credits recorded and the next period's start set.
    by_registry:
      puro:
        label: CORCs issued
        sub: Whole tonnes on Puro Registry
      isometric:
        sub: Batches on Isometric Registry
    tasks:
      - id: issued.count
        kind: question
        label: Credits issued
        ask: How many credits were issued for the period?
        why: They go into the removal ledger.
        input: { type: number, unit: credits }
        cortex:
          role: check
          check: issued-count
          uses:
            - { id: protocols, doing: checks whole-tonne units }
            - { id: reports, doing: adds them to the ledger }
        by_registry:
          puro:
            label: CORCs issued
            ask: How many CORCs did Puro issue for the period?
            why: CORCs are whole tonnes; anything under one tonne carries forward.
            input: { type: number, unit: CORCs }
          isometric:
            ask: How many tonnes did Isometric issue for the period, before the buffer?
            why: Each GHG entry is its own batch in kilograms, and 1% goes to the buffer unless the regime is recognised.
            input: { type: number, unit: t }

      - id: issued.vintage
        kind: question
        label: Vintage
        ask: Which vintage are they?
        why: The vintage is the year the period (or entry) ends.
        input: { type: number, unit: year, placeholder: "2026" }
        cortex:
          role: check
          check: vintage
          uses:
            - { id: protocols, doing: checks the year }

      - id: issued.next
        kind: question
        label: Next period
        ask: When does the next monitoring period start?
        why: Periods must not overlap, and a gap leaves removals uncredited.
        input: { type: date }
        cortex:
          role: check
          check: next-period
          uses:
            - { id: protocols, doing: checks for overlap or gaps }
            - { id: schedules, doing: opens the next period }
        by_registry:
          puro:
            why: More than 12 months late with a report suspends the facility; more than 18 withdraws it and needs a new validation.
          isometric:
            why: More than 12 months without verification triggers a PDD update and re-validation.
