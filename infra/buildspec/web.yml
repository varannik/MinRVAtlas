version: 0.2

# CodeBuild is not in a VPC, so local Docker layer cache is valid.
cache:
  paths:
    - "/root/.npm/**/*"
    - "apps/web/node_modules/**/*"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Node $(node -v)"
      - chmod +x infra/buildspec/push-image.sh
  build:
    commands:
      - infra/buildspec/push-image.sh

artifacts:
  files:
    - imagedefinitions-web.json
